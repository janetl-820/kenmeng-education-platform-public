<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brandmark"><img src="assets/A-white.png" alt="AVEDA A"></div><div><h1>肯夢教育平台</h1><small>AVEDA EDUCATION</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot"><div class="userchip"><div class="avatar" id="avatar">公</div><div><b id="userName">示範行政</b><small id="userRole">營運行政</small></div></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" onclick="toggleMenu()">☰</button><h2 id="pageTitle">營運總覽</h2></div><div class="top-actions"><button class="iconbtn" title="站內通知">♢</button><select class="role-select" id="roleSelect" aria-label="模擬登入角色"><option value="admin">行政｜示範行政</option><option value="teacher">講師｜示範講師 A</option><option value="manager">經營者｜示範經營者</option><option value="student">經銷學生｜示範學生 A</option><option value="internal">自營店技術師｜示範技術師</option></select></div></header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><h3 id="modalTitle"></h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const state={role:'admin',page:'home',points:180,courseFilter:'全部',pending:[
 {id:1,name:'示範經營者',store:'示範經銷店',course:'頭皮養護進階實作',date:'2026/09/18',cost:20,status:'pending'},
 {id:2,name:'示範學生 A',store:'示範經銷店',course:'頭皮養護進階實作',date:'2026/09/18',cost:20,status:'pending'},
 {id:3,name:'示範學生 B',store:'示範經銷店',course:'頭皮養護進階實作',date:'2026/09/18',cost:20,status:'pending'},
 {id:4,name:'示範學生 D',store:'示範合作店 B',course:'秋冬色彩趨勢',date:'2026/08/28',cost:15,status:'waitlist'}
],applications:[],assignStatus:'pending',uploaded:0,waitInvite:true,scheduleView:'all',teacherScheduleView:'all',selectedDate:'2026-09-02',assignedCourseIds:['demo-01','demo-03','demo-05'],leaveRequests:[],partnerSessions:{},visibilityAudit:[],passwordChanged:{admin:false,teacher:false,manager:false,student:false,internal:false}};
const users={admin:{name:'示範行政',role:'營運行政',avatar:'公'},teacher:{name:'示範講師 A',role:'專任講師',avatar:'師'},manager:{name:'示範經營者',role:'示範經銷店・經營者',avatar:'店'},student:{name:'示範學生 A',role:'示範經銷店・學生',avatar:'學'},internal:{name:'示範技術師',role:'示範自營店・C級技術師',avatar:'技'}};
const navs={
 admin:[['home','總覽','⌂'],['reviews','報名審核','✓'],['leave','請假確認','○'],['courses','課程與場次','◫'],['accounts','帳號與店家','◎'],['waitlist','候補管理','↻'],['points','點數流水','◇'],['messages','訊息查閱','✉'],['announcements','公告管理','◉'],['permissions','權限矩陣','▦'],['settings','帳號設定','⚙']],

 student:[['home','我的首頁','⌂'],['schedule','我的課程','◫'],['assignments','我的作業','◇'],['messages','訊息中心','✉'],['announcements','課程公告','◉'],['settings','帳號設定','⚙']],

};

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderNav(){document.getElementById('nav').innerHTML=navs[state.role].map(([p,l,i])=>`<button class="${p===state.page?'active':''}" onclick="go('${p}')"><span class="ico">${i}</span>${l}</button>`).join('')}
function go(page){state.page=page;render();document.getElementById('sidebar').classList.remove('open')}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
function shell(body){return `<div class="callout" style="margin-bottom:18px"><b>公開展示版：</b>所有姓名、店家、課程、教室與數據均為虛構示範資料，不連接正式帳號或內部資料庫。</div>${body}`}
function metric(label,value,note){return `<div class="card metric"><div class="spot"></div><span class="label">${label}</span><strong>${value}</strong><small>${note}</small></div>`}
function courseColor(c){return c.category==='新人課'?'newcomer':c.category==='集體必修課'?'collective':c.category==='Salon 選修課'?'elective':''}
function courseCard(c,canApply=true){let detail=[c.category,c.technique,c.level?`等級 ${c.level}`:'',c.cohort?`梯次 ${c.cohort}`:''].filter(Boolean).join('・');let action=canApply?(c.bookingReady?`<button class="btn primary small" onclick="openApply('${c.title}',${c.cost})">替成員報名</button>`:`<button class="btn ghost small" disabled>待行政設定</button>`):`<button class="btn secondary small" onclick="toast('已開啟課程須知')">查看內容</button>`;return `<article class="card course"><div class="course-cover ${courseColor(c)}"><span class="tag">${detail}</span><div class="datebox"><b>${c.day}</b><span>${c.month}</span></div></div><div class="course-body"><h4>${c.title}</h4><div class="meta"><span>◷ ${c.weekday}・${c.time||'時間待行政設定'}</span><span>⌖ ${c.place}</span><span>講師　${c.teacher}</span></div><div class="course-foot"><span class="${c.bookingReady?'points':'pending-config'}">${c.bookingReady?c.cost+' 點':'點數／名額待設定'}</span>${action}</div></div></article>`}
const courses=window.SEPTEMBER_COURSES||[];
function partnerCourses(){return getPartnerCatalog(courses,state.partnerSessions)}
function filteredPartnerCourses(){let list=partnerCourses();return state.courseFilter==='全部'?list:list.filter(c=>c.category===state.courseFilter)}
function partnerCourseFilters(){let categories=['全部','技術師課','新人課','集體必修課','Salon 選修課'],count=filteredPartnerCourses().length;return `<div class="subnav">${categories.map(x=>`<button class="${state.courseFilter===x?'active':''}" onclick="setCourseFilter('${x}')">${x}</button>`).join('')}<span class="catalog-count">顯示 ${count} 門已開放課程</span></div>`}
function openPartnerSettings(courseId){let c=courses.find(x=>x.id===courseId),cfg=state.partnerSessions[courseId]||{};document.getElementById('modalTitle').textContent='經銷夥伴開放設定';document.getElementById('modalBody').innerHTML=`<div class="callout"><b>${esc(c.title)}</b><br>${esc(c.date)}・${esc(c.place)}<br>從排課表匯入的場次預設為自營店專用。</div><div class="checkrow" style="margin-top:18px"><input id="partnerOpen" type="checkbox" ${cfg.partnerOpen?'checked':''}><label for="partnerOpen"><b>開放經銷夥伴報名</b><br><span class="hint">開放前須完成下列所有欄位</span></label></div><label class="hint">上課時間</label><input id="partnerTime" class="search" style="width:100%;margin:6px 0 12px" value="${esc(cfg.time||c.time||'')}" placeholder="例如 10:00"><div class="grid two"><div><label class="hint">每人點數</label><input id="partnerCost" type="number" min="1" class="search" style="width:100%;margin:6px 0 12px" value="${cfg.cost||''}" placeholder="例如 12"></div><div><label class="hint">招生名額</label><input id="partnerCapacity" type="number" min="1" class="search" style="width:100%;margin:6px 0 12px" value="${cfg.capacity||''}" placeholder="例如 20"></div></div><label class="hint">報名截止日</label><input id="partnerDeadline" type="date" class="search" style="width:100%;margin:6px 0 12px" value="${esc(cfg.deadline||'')}" ><label class="hint">課程須知</label><textarea id="partnerNotice" rows="4" style="width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px" placeholder="請填寫攜帶物品或課前準備">${esc(cfg.notice||'')}</textarea>`;document.getElementById('modalFoot').innerHTML=`<button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" onclick="savePartnerSettings('${courseId}')">儲存設定</button>`;document.getElementById('modal').classList.add('show')}
function savePartnerSettings(courseId){let c=courses.find(x=>x.id===courseId),input={partnerOpen:document.getElementById('partnerOpen').checked,time:document.getElementById('partnerTime').value,cost:document.getElementById('partnerCost').value,capacity:document.getElementById('partnerCapacity').value,deadline:document.getElementById('partnerDeadline').value,notice:document.getElementById('partnerNotice').value};try{let before=state.partnerSessions[courseId]?.partnerOpen||false;state.partnerSessions[courseId]=savePartnerSession(c,input);if(before!==input.partnerOpen)state.visibilityAudit.push({courseId,open:input.partnerOpen,operator:'示範行政',time:'2026-09-03 14:30'});closeModal();toast(input.partnerOpen?'已開放此場次予經銷夥伴報名':'已設為自營店專用');render()}catch(error){toast('開放前請完整填寫時間、點數、名額、截止日與課程須知')}}
function assignedCourses(){return getScheduleCourses(courses,'mine',state.assignedCourseIds)}
function setScheduleView(view){state.scheduleView=view;let visible=getScheduleCourses(courses,view,state.assignedCourseIds);if(visible.length&&!visible.some(c=>c.date===state.selectedDate))state.selectedDate=visible[0].date;render()}
function selectScheduleDate(date){state.selectedDate=date;render()}
function leaveFor(courseId){return state.leaveRequests.find(r=>r.courseId===courseId)}
function internalCalendar(){let visible=getScheduleCourses(courses,state.scheduleView,state.assignedCourseIds),cells=buildMonthGrid(2026,8,visible),selected=visible.filter(c=>c.date===state.selectedDate),mine=state.scheduleView==='mine';let calendar=cells.map(cell=>{let events=cell.courses.slice(0,2).map(c=>`<span class="event-pill ${state.assignedCourseIds.includes(c.id)?'mine':''}">${esc(c.time||'待設定')} ${esc(c.title)}</span>`).join('');let more=cell.courses.length>2?`<span class="event-more">另 ${cell.courses.length-2} 門</span>`:'';return `<button class="day-cell ${cell.inMonth?'':'outside'} ${cell.date===state.selectedDate?'selected':''}" onclick="selectScheduleDate('${cell.date}')" aria-label="${cell.date}，${cell.courses.length} 門課程"><span class="day-number">${cell.day}</span><span class="day-events">${events}${more}</span></button>`}).join('');let detail=selected.length?selected.map(c=>{let assigned=state.assignedCourseIds.includes(c.id),leave=leaveFor(c.id),action='';if(mine&&assigned){action=leave?`<span class="status ${leave.status==='approved_leave'?'approved':'pending'}">${leave.status==='approved_leave'?'已請假':'請假待確認'}</span>`:`<button class="btn ghost small" onclick="openLeaveRequest('${c.id}')">提出請假</button>`}return `<div class="day-course"><time>${c.time||'待設定'}</time><div><h4>${esc(c.title)} ${assigned?'<span class="status approved">我的課程</span>':''}</h4><div class="hint">${esc(c.place)}｜講師 ${esc(c.teacher)}｜${esc(c.category)}</div></div><div class="course-actions">${action}</div></div>`}).join(''):`<div class="empty">這一天沒有${mine?'已安排的':''}課程</div>`;return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">AVEDA EDUCATION CALENDAR</div><h3>2026 年 9 月課程行事曆</h3><p>${mine?'只顯示教育訓練行政已安排給你的課程':'查看講師在哪一天、哪間教室授課；不提供報名功能'}</p></div><span class="status ${mine?'approved':'waitlist'}">${mine?'行政安排・不可自行異動':'唯讀課程資訊'}</span></div><div class="schedule-tabs"><button class="${mine?'':'active'}" onclick="setScheduleView('all')">全部課程</button><button class="${mine?'active':''}" onclick="setScheduleView('mine')">我的課程</button></div><div class="card calendar-card"><div class="calendar-head"><button class="btn ghost small" disabled>‹</button><h3>2026 年 9 月</h3><button class="btn ghost small" disabled>›</button></div><div class="calendar-scroll"><div class="calendar"><div class="weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="calendar-grid">${calendar}</div></div></div></div><div class="card day-detail"><div class="section-head" style="margin:0 0 5px"><div><h3>${state.selectedDate.replaceAll('-','/')} 課程</h3><p>點選月曆日期即可查看當天完整內容</p></div></div>${detail}${mine?'<div class="leave-note">請假須經行政確認才成立；確認後不另行安排補課。</div>':''}</div>`}
function setTeacherScheduleView(view){state.teacherScheduleView=view;let visible=view==='all'?courses:getTeacherCourses(courses,'示範講師 A');if(visible.length&&!visible.some(c=>c.date===state.selectedDate))state.selectedDate=visible[0].date;render()}
function teacherCalendar(){let teaching=state.teacherScheduleView==='teaching',mine=getTeacherCourses(courses,'示範講師 A'),visible=teaching?mine:courses,cells=buildMonthGrid(2026,8,visible),selected=visible.filter(c=>c.date===state.selectedDate);let calendar=cells.map(cell=>{let events=cell.courses.slice(0,2).map(c=>`<span class="event-pill ${c.teacher.includes('示範講師 A')?'mine':''}">${esc(c.time||'待設定')} ${esc(c.title)}</span>`).join('');let more=cell.courses.length>2?`<span class="event-more">另 ${cell.courses.length-2} 門</span>`:'';return `<button class="day-cell ${cell.inMonth?'':'outside'} ${cell.date===state.selectedDate?'selected':''}" onclick="selectScheduleDate('${cell.date}')" aria-label="${cell.date}，${cell.courses.length} 門課程"><span class="day-number">${cell.day}</span><span class="day-events">${events}${more}</span></button>`}).join('');let detail=selected.length?selected.map(c=>{let own=c.teacher.includes('示範講師 A');return `<div class="day-course"><time>${c.time||'待設定'}</time><div><h4>${esc(c.title)} ${own?'<span class="status approved">我的授課</span>':''}</h4><div class="hint">${esc(c.place)}｜講師 ${esc(c.teacher)}｜${esc(c.category)}</div></div><div class="course-actions">${own?'<button class="btn secondary small" onclick="go(\'students\')">查看學生名單</button>':''}</div></div>`}).join(''):`<div class="empty">這一天沒有${teaching?'個人授課':''}課程</div>`;return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">INSTRUCTOR CALENDAR</div><h3>2026 年 9 月講師課程行事曆</h3><p>${teaching?'顯示本月份由 示範講師 A 負責授課的課程':'查看本月份所有教室與講師的完整排課'}</p></div><span class="status ${teaching?'approved':'waitlist'}">${teaching?mine.length+' 門我的授課':'完整排課'}</span></div><div class="schedule-tabs"><button class="${teaching?'':'active'}" onclick="setTeacherScheduleView('all')">全部課程</button><button class="${teaching?'active':''}" onclick="setTeacherScheduleView('teaching')">我的授課</button></div><div class="card calendar-card"><div class="calendar-head"><button class="btn ghost small" disabled>‹</button><h3>2026 年 9 月</h3><button class="btn ghost small" disabled>›</button></div><div class="calendar-scroll"><div class="calendar"><div class="weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="calendar-grid">${calendar}</div></div></div></div><div class="card day-detail"><div class="section-head" style="margin:0 0 5px"><div><h3>${state.selectedDate.replaceAll('-','/')} 課程</h3><p>點選月曆日期即可查看當天完整內容</p></div></div>${detail}</div>`}
function openLeaveRequest(courseId){let c=courses.find(x=>x.id===courseId);document.getElementById('modalTitle').textContent='提出課程請假';document.getElementById('modalBody').innerHTML=`<div class="callout"><b>${esc(c.title)}</b><br>${esc(c.date)}・${esc(c.place)}<br>請假須由行政確認，且不另外安排補課。</div><label class="hint" style="display:block;margin-top:18px">請假原因</label><textarea id="leaveReason" rows="5" style="width:100%;margin-top:7px;border:1px solid var(--line);border-radius:12px;padding:12px" placeholder="請填寫請假原因"></textarea><input id="leaveCourseId" type="hidden" value="${esc(courseId)}">`;document.getElementById('modalFoot').innerHTML=`<button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitLeaveRequest()">送出請假</button>`;document.getElementById('modal').classList.add('show')}
function submitLeaveRequest(){let courseId=document.getElementById('leaveCourseId').value,reason=document.getElementById('leaveReason').value;try{let request=createLeaveRequest({courseId,reason,assignedCourseIds:state.assignedCourseIds});state.leaveRequests.push(request);closeModal();toast('請假已送出，等待行政確認');render()}catch(error){toast(error.message.includes('reason')?'請填寫請假原因':'此課程無法提出請假')}}
function confirmLeave(index){state.leaveRequests[index]=approveLeaveRequest(state.leaveRequests[index]);toast('行政已確認請假；此課程不安排補課');render()}
function leaveReview(){let rows=state.leaveRequests.map((r,i)=>{let c=courses.find(x=>x.id===r.courseId);return `<tr><td><b>示範技術師</b><br><span class="hint">示範自營店・C級技術師</span></td><td>${esc(c.title)}<br><span class="hint">${esc(c.date)}・${esc(c.place)}</span></td><td>${esc(r.reason)}</td><td><span class="status ${r.status==='approved_leave'?'approved':'pending'}">${r.status==='approved_leave'?'已請假':'待行政確認'}</span></td><td>${r.status==='pending_admin'?`<button class="btn primary small" onclick="confirmLeave(${i})">確認請假</button>`:'不安排補課'}</td></tr>`}).join('');return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">LEAVE APPROVAL</div><h3>自營店技術師請假確認</h3><p>請假經行政確認後生效，不扣點且不另外安排補課</p></div></div><div class="table-card"><div class="table-wrap"><table><thead><tr><th>技術師</th><th>原定課程</th><th>請假原因</th><th>狀態</th><th>行政處理</th></tr></thead><tbody>${rows||'<tr><td colspan="5"><div class="empty">目前沒有待確認的請假申請</div></td></tr>'}</tbody></table></div></div>`}
function snapshotBanner(){return `<div class="sourcebar"><div><b>公開展示課程</b><p class="hint">展示資料：${COURSE_SNAPSHOT.spreadsheetTitle}／${COURSE_SNAPSHOT.sheet}（${COURSE_SNAPSHOT.range}）・擷取日 ${COURSE_SNAPSHOT.snapshotDate}</p></div><a class="btn ghost small" href="${COURSE_SNAPSHOT.sourceUrl}" target="_blank" rel="noopener">查看來源</a></div>`}
function courseFilters(){let categories=['全部','技術師課','新人課','集體必修課','Salon 選修課'];return `<div class="subnav">${categories.map(x=>`<button class="${state.courseFilter===x?'active':''}" onclick="setCourseFilter('${x}')">${x}</button>`).join('')}<span class="catalog-count">顯示 ${filterSeptemberCourses(state.courseFilter).length} 門課程</span></div>`}
function setCourseFilter(category){state.courseFilter=category;render()}
function courseCatalog(){let list=filteredPartnerCourses();return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">PARTNER COURSE CATALOG</div><h3>2026 年 9 月開放課程</h3><p>只顯示行政已開放予經銷夥伴的場次；由經營者替同店成員申請</p></div><div class="points">可用 ${state.points} 點</div></div><div class="callout" style="margin-bottom:18px">自營店專用排課不會出現在此頁面。行政完成場次設定並開放後，經銷夥伴才可查看及報名。</div>${partnerCourseFilters()}${list.length?`<div class="grid three">${list.map(c=>courseCard(c,true)).join('')}</div>`:'<div class="card empty"><h3>目前沒有開放課程</h3><p>請稍後再查看行政公布的經銷夥伴課程。</p></div>'}`}
function courseManagement(){let list=filterSeptemberCourses(state.courseFilter);return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">COURSE SESSIONS</div><h3>9 月課程與場次</h3><p>所有試算表課程預設為自營店專用；行政可逐場開放予經銷夥伴</p></div><span class="status waitlist">已記錄 ${state.visibilityAudit.length} 次開放異動</span></div>${snapshotBanner()}${courseFilters()}<div class="table-card"><div class="table-wrap"><table><thead><tr><th>日期</th><th>課程</th><th>教室／講師</th><th>經銷夥伴權限</th><th>報名設定</th></tr></thead><tbody>${list.map(c=>{let cfg=state.partnerSessions[c.id],open=cfg?.partnerOpen;return `<tr><td><b>09/${c.day}</b><br><span class="hint">${c.weekday}・${cfg?.time||c.time||'時間待設定'}</span></td><td><b>${c.title}</b><br><span class="hint">${c.category}${c.level?'・'+c.level:''}</span></td><td>${c.place}<br><span class="hint">${c.teacher}</span></td><td><span class="status ${open?'approved':'waitlist'}">${open?'已開放報名':'自營店專用'}</span></td><td>${open?`<b>${cfg.cost} 點／${cfg.capacity} 名</b><br><span class="hint">截止 ${cfg.deadline}</span>`:'<span class="hint">不出現在經銷夥伴目錄</span>'}<br><button class="btn ${open?'ghost':'secondary'} small" style="margin-top:7px" onclick="openPartnerSettings('${c.id}')">設定開放權限</button></td></tr>`}).join('')}</tbody></table></div></div>`}
function adminHome(){return `<section class="hero"><div><div class="eyebrow" style="color:#f0cf9a">OPERATIONS OVERVIEW</div><h3>歡迎使用行政操作展示。</h3><p>今天有 8 筆報名等待逐人審核、3 份作業待講師確認。錄取時系統才會建立點數扣除紀錄。</p></div><div class="hero-stats"><div class="hero-stat"><strong>8</strong><span>待審核報名</span></div><div class="hero-stat"><strong>2</strong><span>候補邀請中</span></div><div class="hero-stat"><strong>3</strong><span>示範合作店家</span></div><div class="hero-stat"><strong>12</strong><span>示範帳號</span></div></div></section><div class="section-head"><div><h3>今日營運摘要</h3><p>即時掌握報名、點數與課程狀況</p></div></div><div class="grid four">${metric('本月開課場次','12','較上月 +2 場')}${metric('本月錄取人次','86','錄取率 78%')}${metric('點數異動','1,240','本月已扣除點數')}${metric('待處理訊息','5','含 2 則未讀')}</div><div class="split"><div><div class="section-head"><div><h3>最近申請</h3><p>所有申請均需行政逐人處理</p></div><button class="linkbtn" onclick="go('reviews')">查看全部 →</button></div>${reviewTable(true)}</div><div><div class="section-head"><div><h3>營運提醒</h3><p>需要留意的項目</p></div></div><div class="card"><div class="notice"><span class="notice-dot"></span><div><h4>「頭皮養護進階」剩餘 2 名</h4><p>目前另有 4 位待審核，請確認錄取名額。</p></div></div><div class="notice"><span class="notice-dot"></span><div><h4>2 批點數將於 60 天內到期</h4><p>共涉及 3 間合作店家、120 點。</p></div></div><div class="notice"><span class="notice-dot"></span><div><h4>下週有 3 場課程</h4><p>講師與場地皆已確認。</p></div></div></div></div></div>`}
function reviewTable(compact=false){let rows=state.pending.slice(0,compact?3:99);return `<div class="table-card"><div class="table-wrap"><table><thead><tr><th>申請人</th><th>店家</th><th>課程／日期</th><th>點數</th><th>狀態</th><th>逐人處理</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="member"><div class="mini-avatar">${r.name[0]}</div><b>${r.name}</b></div></td><td>${r.store}</td><td>${r.course}<br><span class="hint">${r.date}</span></td><td>${r.cost}</td><td><span class="status ${r.status}">${statusText(r.status)}</span></td><td>${r.status==='pending'?`<button class="btn secondary small" onclick="decide(${r.id},'approved')">錄取</button> <button class="btn ghost small" onclick="decide(${r.id},'waitlist')">候補</button> <button class="btn danger small" onclick="decide(${r.id},'rejected')">拒絕</button>`:'—'}</td></tr>`).join('')}</tbody></table></div></div>`}
function statusText(s){return {pending:'待審核',approved:'已錄取',waitlist:'候補中',rejected:'未錄取',cancelled:'已取消'}[s]||s}
function reviews(){return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">REGISTRATION REVIEW</div><h3>逐人審核報名</h3><p>同一店家可一次申請多人，但每位學員保留獨立審核結果</p></div></div><div class="callout">系統規則：按下「錄取」時才檢查名額與店家點數，並建立扣點流水；候補及未錄取不扣點。</div><div class="section-head"><div><h3>待處理與近期紀錄</h3></div><button class="btn primary" onclick="toast('篩選器已重設')">匯出審核清單</button></div>${reviewTable(false)}`}
function decide(id,status){let r=state.pending.find(x=>x.id===id);if(!r)return;r.status=status;toast(status==='approved'?`已錄取 ${r.name}，並扣除 ${r.cost} 點`:`已將 ${r.name} 設為「${statusText(status)}」；未扣點`);render()}
function adminGeneric(){const p=state.page;if(p==='permissions')return permissions();if(p==='reviews')return reviews();if(p==='courses')return courseManagement();if(p==='accounts')return adminAccounts();if(p==='settings')return accountSettings();if(p==='waitlist')return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">WAITLIST CONTROL</div><h3>候補順位管理</h3><p>名額釋出後，僅通知該場次第一順位店家</p></div></div><div class="grid two"><div class="card"><span class="status waitlist">邀請中・第 1 順位</span><h3>秋冬色彩趨勢</h3><p class="hint">示範合作店 B｜示範學生 D<br>回覆期限：2026/08/10 18:00</p><div class="callout">等待經營者接受。接受後系統才會再次檢查點數、扣點並正式錄取。</div></div><div class="card"><span class="status waitlist">候補中・第 2 順位</span><h3>秋冬色彩趨勢</h3><p class="hint">示範合作店 C｜示範學生 E</p><button class="btn ghost" disabled>等待前順位回覆</button></div></div>`;
let data={courses:['課程與場次','維護課程主檔、日期、講師、名額、點數與 30 天取消界線'],accounts:['帳號與店家','建立與停用行政、講師、經營者、學生帳號；每店資料隔離'],points:['點數流水','以異動紀錄管理點數，不直接覆寫餘額'],messages:['訊息查閱','行政可查閱師生對話以處理客服與爭議'],announcements:['公告管理','發布全站、指定角色、店家或課程公告']}[p]||['功能頁面','示範管理功能'];return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">ADMIN CONSOLE</div><h3>${data[0]}</h3><p>${data[1]}</p></div><button class="btn primary" onclick="toast('已建立一筆示範資料')">＋ 新增</button></div>${genericRows(p)}`}
function genericRows(p){let rows=p==='accounts'?[['示範經銷店','4 個帳號','啟用'],['示範合作店 B','3 個帳號','啟用'],['示範合作店 C','2 個帳號','啟用']]:p==='members'?[['示範經營者','經營者・可報名與取消','啟用'],['示範學生 A','學生・僅個人學習功能','啟用'],['示範學生 B','學生・僅個人學習功能','啟用'],['示範學生 C','學生・僅個人學習功能','啟用']]:p==='points'?[['示範經銷店','課程錄取：示範經營者','-20'],['示範合作店 B','年度教育點數','+200'],['示範經銷店','30天前取消退點','+15']]:p==='messages'?[['示範學生 A ↔ 示範講師 B','頭皮養護基礎實作','1 則未讀'],['示範學生 D ↔ 示範講師 C','秋冬色彩趨勢','已讀'],['示範學生 B ↔ 示範講師 B','頭皮養護進階實作','已讀']]:[['頭皮養護進階實作','2026/09/18','啟用'],['秋冬色彩趨勢','2026/08/28','啟用'],['顧客諮詢與提案力','2026/10/06','草稿']];return `<div class="table-card"><div class="toolbar"><input class="search" placeholder="搜尋資料…"><button class="btn ghost">篩選</button></div><div class="table-wrap"><table><thead><tr><th>名稱</th><th>資訊</th><th>狀態／異動</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td><button class="btn secondary small" onclick="toast('${p==='members'?'此帳號由行政後台管理':'已開啟編輯畫面'}')">${p==='members'?'查看':'查看與編輯'}</button></td></tr>`).join('')}</tbody></table></div></div>`}
function permissions(){let items=[['查看店家點數',1,0,1,0,0],['替同店多人報名',0,0,1,0,0],['取消已錄取課程',0,0,1,0,0],['查看全部課程月曆',1,1,1,0,1],['查看自己的課程',1,1,1,1,1],['提出課程請假',0,0,0,0,1],['確認自營技術師請假',1,0,0,0,0],['繳交自己的作業',0,0,1,1,1],['審核作業',0,1,0,0,0],['管理課程與場次',1,0,0,0,0],['逐人審核報名',1,0,0,0,0],['查閱師生訊息',1,0,0,0,0]];return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">ROLE-BASED ACCESS</div><h3>權限系統</h3><p>經銷夥伴沿用點數報名；自營店技術師由行政排課且不使用點數</p></div></div><div class="table-card" style="overflow:auto"><div class="permission"><div class="head">功能</div><div class="head">行政</div><div class="head">講師</div><div class="head">經營者</div><div class="head">經銷學生</div><div class="head">自營技術師</div>${items.map(x=>x.map((v,i)=>`<div>${i?`<span class="${v?'yes':'no'}">${v?'✓':'—'}</span>`:v}</div>`).join('')).join('')}</div></div>`}
function adminAccounts(){let accounts=[['示範經營者','demo.manager','示範經銷店・經營者','啟用'],['示範學生 A','demo.student','示範經銷店・學生','啟用'],['示範講師 B','demo.teacher','講師','啟用'],['示範行政','demo.admin','行政','啟用']];return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">ACCOUNT ADMINISTRATION</div><h3>帳號與密碼管理</h3><p>初始帳號密碼由行政提供；使用者忘記密碼時，只能由行政重新設定</p></div><button class="btn primary" onclick="toast('已開啟建立帳號流程；系統將由行政設定初始密碼')">＋ 建立帳號</button></div><div class="callout"><b>密碼規則：</b>平台不提供「忘記密碼」自助寄信或重設連結。行政重設後應透過可信任管道個別交付新密碼；原密碼立即失效。</div><div class="table-card" style="margin-top:18px"><div class="toolbar"><input class="search" placeholder="搜尋姓名、帳號或店家…"><button class="btn ghost">篩選角色</button></div><div class="table-wrap"><table><thead><tr><th>使用者</th><th>登入帳號</th><th>身分／所屬</th><th>狀態</th><th>密碼操作</th></tr></thead><tbody>${accounts.map(a=>`<tr><td><div class="member"><div class="mini-avatar">${a[0][0]}</div><b>${a[0]}</b></div></td><td>${a[1]}</td><td>${a[2]}</td><td><span class="status approved">${a[3]}</span></td><td><button class="btn secondary small" onclick="openResetPassword('${a[0]}','${a[1]}')">重新設定密碼</button></td></tr>`).join('')}</tbody></table></div></div>`}
function accountSettings(){let u=users[state.role],changed=state.passwordChanged[state.role];return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">ACCOUNT SECURITY</div><h3>我的帳號設定</h3><p>所有登入者都可以自行決定是否更換密碼</p></div></div><div class="split"><div class="card"><div class="member"><div class="avatar">${u.avatar}</div><div><h3 style="margin:0 0 4px">${u.name}</h3><div class="hint">${u.role}</div></div></div><div class="callout" style="margin-top:20px">目前密碼狀態：<b>${changed?'已由本人更新':'使用行政提供的初始密碼'}</b><br>首次登入後可繼續使用初始密碼，也可以自行修改；平台不強制更換。</div><h3 style="margin-top:24px">自行更換密碼</h3><label class="hint">目前密碼</label><input id="currentPw" type="password" class="search" style="width:100%;margin:6px 0 12px" placeholder="輸入目前密碼"><label class="hint">新密碼</label><input id="newPw" type="password" class="search" style="width:100%;margin:6px 0 12px" placeholder="至少 8 個字元"><label class="hint">再次輸入新密碼</label><input id="confirmPw" type="password" class="search" style="width:100%;margin:6px 0 14px" placeholder="再次輸入"><button class="btn primary" onclick="changeOwnPassword()">儲存新密碼</button></div><div class="card"><h3>忘記密碼怎麼辦？</h3><p class="hint" style="font-size:13px">基於平台規則，不提供 Email、自助連結或安全問題重設密碼。</p><div class="callout">請直接聯絡行政後台人員。行政確認身分後，會重新設定登入密碼並個別提供給你。</div><p class="hint" style="margin-top:18px">行政人員若忘記密碼，須由另一位具有帳號管理權限的行政人員重設，不能自行繞過登入程序。</p><button class="btn ghost" disabled>無自助忘記密碼功能</button></div></div>`}
function changeOwnPassword(){let current=document.getElementById('currentPw').value,n=document.getElementById('newPw').value,confirm=document.getElementById('confirmPw').value;if(!current)return toast('請輸入目前密碼');if(n.length<8)return toast('新密碼至少需要 8 個字元');if(n!==confirm)return toast('兩次輸入的新密碼不一致');if(current===n)return toast('新密碼不可與目前密碼相同');state.passwordChanged[state.role]=true;toast('密碼已成功更新；下次請使用新密碼登入');render()}
function openResetPassword(name,account){document.getElementById('modalTitle').textContent='行政重新設定密碼';document.getElementById('modalBody').innerHTML=`<div class="callout">正在替 <b>${esc(name)}</b>（${esc(account)}）設定新的登入密碼。完成後，舊密碼將立即失效。</div><label class="hint" style="display:block;margin-top:18px">新密碼</label><input id="adminNewPw" type="password" class="search" style="width:100%;margin:6px 0 12px" placeholder="至少 8 個字元"><label class="hint">再次輸入新密碼</label><input id="adminConfirmPw" type="password" class="search" style="width:100%;margin:6px 0 12px" placeholder="再次輸入"><p class="hint">請勿透過公開群組傳送密碼。行政應確認本人身分後，以可信任管道個別提供。</p><input id="resetTarget" type="hidden" value="${esc(name)}">`;document.getElementById('modalFoot').innerHTML=`<button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitResetPassword()">確認重新設定</button>`;document.getElementById('modal').classList.add('show')}
function submitResetPassword(){let n=document.getElementById('adminNewPw').value,c=document.getElementById('adminConfirmPw').value,name=document.getElementById('resetTarget').value;if(n.length<8)return toast('新密碼至少需要 8 個字元');if(n!==c)return toast('兩次輸入的新密碼不一致');closeModal();toast(`已重新設定 ${name} 的密碼，舊密碼已失效並留下操作紀錄`)}
function managerHome(){let open=partnerCourses();return `<section class="hero"><div><div class="eyebrow" style="color:#f0cf9a">PARTNER SPACE</div><h3>經銷夥伴開放課程</h3><p>示範經銷店目前共有 4 位成員。只有教育訓練行政已開放的場次會顯示於課程目錄。</p></div><div class="hero-stats"><div class="hero-stat"><strong>${state.points}</strong><span>店家可用點數</span></div><div class="hero-stat"><strong>4</strong><span>啟用成員</span></div><div class="hero-stat"><strong>${open.length}</strong><span>9 月開放課程</span></div><div class="hero-stat"><strong>${state.applications.length}</strong><span>待審核申請</span></div></div></section>${state.waitInvite?`<div class="section-head"><div><h3>候補邀請</h3><p>請由經營者在期限內確認</p></div></div><div class="card notice"><span class="notice-dot"></span><div style="flex:1"><h4>秋冬色彩趨勢｜示範學生 A獲候補邀請</h4><p>第一順位名額已釋出，接受後將扣除 15 點並正式錄取。回覆期限 08/10 18:00。</p></div><button class="btn primary" onclick="acceptWait()">接受並扣點</button><button class="btn ghost" onclick="state.waitInvite=false;toast('已放棄，系統將通知下一順位');render()">放棄</button></div>`:''}<div class="section-head"><div><h3>9 月近期開放課程</h3><p>行政完成開放設定後才會出現</p></div><button class="linkbtn" onclick="go('catalog')">查看課程目錄 →</button></div>${open.length?`<div class="grid three">${open.slice(0,6).map(c=>courseCard(c,true)).join('')}</div>`:'<div class="card empty">目前沒有開放予經銷夥伴的九月課程。</div>'}`}
function acceptWait(){if(state.points<15)return toast('店家點數不足，請聯絡行政');state.points-=15;state.waitInvite=false;toast('已接受候補邀請、扣除 15 點並正式錄取');render()}
function managerPage(){if(state.page==='home')return managerHome();if(state.page==='settings')return accountSettings();if(state.page==='catalog')return courseCatalog();if(state.page==='bookings')return bookings();if(state.page==='members')return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">STORE MEMBERS</div><h3>示範經銷店成員</h3><p>帳號由行政建立；經營者可查看本店成員與報名狀態</p></div></div>${genericRows('members')}`;if(state.page==='assignments')return studentAssignments(true);return messages('manager')}
function bookings(){let apps=state.applications.map((a,i)=>`<tr><td><b>${a.name}</b></td><td>${a.course}</td><td><span class="status pending">待行政審核</span></td><td>尚未扣點</td><td><button class="btn danger small" onclick="state.applications.splice(${i},1);toast('已撤回尚未審核的申請');render()">撤回</button></td></tr>`).join('');return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">REGISTRATION CONTROL</div><h3>店家報名管理</h3><p>經營者可管理同店成員的申請與取消</p></div></div><div class="table-card"><div class="table-wrap"><table><thead><tr><th>學員</th><th>課程</th><th>狀態</th><th>點數</th><th>操作</th></tr></thead><tbody>${apps}<tr><td><b>示範經營者</b></td><td>顧客諮詢與提案力<br><span class="hint">距上課 61 天</span></td><td><span class="status approved">已錄取</span></td><td>已扣 25 點</td><td><button class="btn danger small" onclick="toast('取消成功，已退還 25 點並通知候補第一順位');state.points+=25">取消並退點</button></td></tr><tr><td><b>示範學生 A</b></td><td>秋冬色彩趨勢<br><span class="hint">距上課 22 天</span></td><td><span class="status approved">已錄取</span></td><td>已扣 15 點</td><td><button class="btn ghost small" disabled>不足 30 天，請聯絡行政</button></td></tr></tbody></table></div></div>`}
function openApply(title,cost){document.getElementById('modalTitle').textContent='替店家成員報名';document.getElementById('modalBody').innerHTML=`<div class="callout">送出申請不代表錄取。行政將逐人決定錄取、候補或未錄取；正式錄取後才扣點。</div><h4>${esc(title)}</h4>${['示範經營者（經營者）','示範學生 A','示範學生 B','示範學生 C'].map((n,i)=>`<div class="checkrow"><input type="checkbox" id="m${i}" value="${esc(n.split('（')[0])}" onchange="applySummary(${cost})"><label for="m${i}">${n}</label><span class="hint">${i?'學生':'可參加課程'}</span></div>`).join('')}<div class="summarybox"><span>已選 <b id="selCount">0</b> 人</span><span>預估 <b id="estPoints">0</b> 點</span></div><p class="hint">預估點數僅供參考，系統只依行政實際錄取人數扣點。</p><input type="hidden" id="applyCourse" value="${esc(title)}"><input type="hidden" id="applyCost" value="${cost}">`;document.getElementById('modalFoot').innerHTML=`<button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitApply()">送出報名申請</button>`;document.getElementById('modal').classList.add('show')}
function applySummary(cost){let n=document.querySelectorAll('.checkrow input:checked').length;document.getElementById('selCount').textContent=n;document.getElementById('estPoints').textContent=n*cost}
function submitApply(){let selected=[...document.querySelectorAll('.checkrow input:checked')];if(!selected.length)return toast('請至少選擇一位成員');let course=document.getElementById('applyCourse').value;let cost=+document.getElementById('applyCost').value;selected.forEach(x=>state.applications.push({name:x.value,course,cost}));closeModal();toast(`已送出 ${selected.length} 位成員的申請，等待行政逐人審核`);state.page='bookings';render()}
function teacherHome(){let mine=getTeacherCourses(courses,'示範講師 A');return `<section class="hero"><div><div class="eyebrow" style="color:#f0cf9a">INSTRUCTOR SPACE</div><h3>示範講師 A，九月授課行程已整理。</h3><p>你可以查看整月完整排課，也可以切換至「我的授課」；另可查看學生名單、回覆訊息與審核作業。</p></div><div class="hero-stats"><div class="hero-stat"><strong>${mine.length}</strong><span>9 月我的授課</span></div><div class="hero-stat"><strong>${courses.length}</strong><span>9 月全部課程</span></div><div class="hero-stat"><strong>3</strong><span>待審作業</span></div><div class="hero-stat"><strong>2</strong><span>待回覆訊息</span></div></div></section><div class="section-head"><div><h3>我的九月授課</h3><p>完整月曆可同時查看其他講師與教室安排</p></div><button class="linkbtn" onclick="go('schedule')">開啟課程行事曆 →</button></div><div class="grid three">${mine.map(renderInternalCourseCard).join('')}</div>`}
function teacherPage(){if(state.page==='home')return teacherHome();if(state.page==='schedule')return teacherCalendar();if(state.page==='settings')return accountSettings();if(state.page==='assignments')return teacherAssignments();if(state.page==='messages')return messages('teacher');return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">ENROLLED STUDENTS</div><h3>我的授課學生名單</h3><p>僅顯示自己負責場次中已錄取的學生</p></div></div>${genericRows('students')}`}
function teacherAssignments(){return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">ASSIGNMENT REVIEW</div><h3>作業審核</h3><p>可標示通過或未通過／需要補交，並保留評語</p></div></div><div class="split"><div class="card"><div class="member"><div class="mini-avatar">陳</div><div><b>示範學生 A</b><div class="hint">頭皮養護基礎實作・第 2 次提交</div></div><span class="status ${state.assignStatus==='passed'?'approved':state.assignStatus==='failed'?'rejected':'pending'}" style="margin-left:auto">${state.assignStatus==='passed'?'已通過':state.assignStatus==='failed'?'需補交':'待審核'}</span></div><div class="grid three" style="margin-top:18px"><div class="upload">作業照片 01<br><span class="hint">操作前</span></div><div class="upload">作業照片 02<br><span class="hint">操作中</span></div><div class="upload">作業照片 03<br><span class="hint">完成照</span></div></div><h4>學生說明</h4><p class="hint">本次練習調整了分區手法與產品用量，請老師協助確認操作順序。</p></div><div class="card"><h3>審核結果</h3><label class="hint">給學生的評語</label><textarea id="feedback" rows="6" style="width:100%;margin:8px 0 14px;border:1px solid var(--line);border-radius:12px;padding:12px" placeholder="輸入具體建議…"></textarea><button class="btn primary" onclick="state.assignStatus='passed';toast('已標示作業通過');render()">通過</button> <button class="btn danger" onclick="state.assignStatus='failed';toast('已要求學生補交');render()">未通過／需補交</button></div></div>`}
function internalHome(){let assigned=assignedCourses(),pending=state.leaveRequests.filter(r=>r.status==='pending_admin').length;return `<section class="hero"><div><div class="eyebrow" style="color:#d8c7aa">AVEDA INTERNAL LEARNING</div><h3>你的教育訓練課程已安排。</h3><p>你可以從整月行事曆查看講師授課時間，也可以切換到個人課程。課程由教育訓練行政統一安排。</p></div><div class="hero-stats"><div class="hero-stat"><strong>${assigned.length}</strong><span>9 月個人課程</span></div><div class="hero-stat"><strong>${courses.length}</strong><span>全部課程</span></div><div class="hero-stat"><strong>${pending}</strong><span>請假待確認</span></div><div class="hero-stat"><strong>C級</strong><span>目前技術等級</span></div></div></section><div class="section-head"><div><h3>9 月課程行事曆</h3><p>查詢講師授課日期與教室</p></div><button class="linkbtn" onclick="go('schedule')">開啟月曆 →</button></div><div class="grid three">${assigned.map(renderInternalCourseCard).join('')}</div><div class="callout" style="margin-top:18px"><b>自營店規則：</b>不可自行報名、取消或更換場次；如無法參加，請在「我的課程」提出請假並等待行政確認。</div>`}
function internalAnnouncements(){return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">ANNOUNCEMENTS</div><h3>課程公告</h3><p>查看教育訓練行政與個人課程公告</p></div></div><div class="grid two"><div class="card notice"><span class="notice-dot"></span><div><h4>技術師九月訓練提醒</h4><p>請依行政安排準時出席；請假須於系統提出並等待確認。</p></div></div><div class="card notice"><span class="notice-dot"></span><div><h4>教室練習安排</h4><p>可先從全部課程月曆確認講師授課時間，再透過站內訊息聯繫講師。</p></div></div></div>`}
function internalPage(){if(state.page==='home')return internalHome();if(state.page==='schedule')return internalCalendar();if(state.page==='settings')return accountSettings();if(state.page==='assignments')return studentAssignments(false);if(state.page==='messages')return messages('internal');return internalAnnouncements()}
function studentHome(){return `<section class="hero"><div><div class="eyebrow" style="color:#f0cf9a">MY LEARNING</div><h3>下一堂課已準備好了。</h3><p>你可以查看自己已錄取的課程、課程須知、聯絡講師與繳交作業。報名與取消由店家經營者統一操作。</p></div><div class="hero-stats"><div class="hero-stat"><strong>2</strong><span>已錄取課程</span></div><div class="hero-stat"><strong>1</strong><span>待繳作業</span></div><div class="hero-stat"><strong>1</strong><span>講師新回覆</span></div><div class="hero-stat"><strong>86%</strong><span>學習完成度</span></div></div></section><div class="section-head"><div><h3>我的近期課程</h3><p>僅顯示與你本人相關的課程</p></div></div><div class="grid two">${courses.slice(0,2).map(c=>courseCard(c,false)).join('')}</div><div class="callout" style="margin-top:18px"><b>權限提醒：</b>一般學生不會看到店家點數、其他成員、候補順位或完整報名紀錄，也無法自行報名與取消。如需異動，請聯絡店家經營者。</div>`}
function studentPage(){if(state.page==='home')return studentHome();if(state.page==='settings')return accountSettings();if(state.page==='assignments')return studentAssignments(false);if(state.page==='messages')return messages('student');if(state.page==='announcements')return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">ANNOUNCEMENTS</div><h3>課程公告</h3><p>查看與自己課程及身分相關的公告</p></div></div><div class="grid two"><div class="card notice"><span class="notice-dot"></span><div><h4>秋冬色彩趨勢｜課前準備</h4><p>請於開課前完成線上教材閱讀，直播連結將於站內通知顯示。</p></div></div><div class="card notice"><span class="notice-dot"></span><div><h4>台北教育中心交通提醒</h4><p>教育中心不提供停車位，建議搭乘大眾運輸前往。</p></div></div></div>`;return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">MY COURSES</div><h3>我的課程</h3><p>查看已錄取課程、時間、地點與課程須知</p></div></div><div class="grid two">${courses.slice(0,2).map(c=>courseCard(c,false)).join('')}</div>`}
function studentAssignments(manager){return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">MY ASSIGNMENTS</div><h3>${manager?'我的作業':'作業繳交'}</h3><p>每次最多上傳 20 張圖片；送出後由課程講師審核</p></div></div><div class="split"><div class="card"><span class="status pending">待繳交</span><h3>頭皮養護操作紀錄</h3><p class="hint">請依序上傳操作前、操作過程與完成結果，並簡述本次使用的產品與手法。</p><div class="upload"><div style="font-size:32px">▧</div><b>拖曳圖片至此，或選擇檔案</b><p class="hint">支援 JPG、PNG、HEIC；最多 20 張</p><label class="btn secondary" for="files">選擇圖片</label><input id="files" type="file" accept="image/*" multiple onchange="filesPicked(this)"></div><p id="fileCount" class="hint">尚未選擇圖片</p></div><div class="card"><h3>繳交說明</h3><textarea rows="8" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:12px" placeholder="輸入本次練習說明…"></textarea><button class="btn primary" style="width:100%;margin-top:14px" onclick="toast(state.uploaded?'作業已送出，等待講師審核':'請先選擇至少一張圖片')">送出作業</button><p class="hint">講師可標示通過或未通過／需要補交，歷次提交會保留。</p></div></div>`}
function filesPicked(input){let n=input.files.length;if(n>20){input.value='';state.uploaded=0;document.getElementById('fileCount').textContent='超過上限，請重新選擇最多 20 張圖片';toast('一次最多只能上傳 20 張圖片');return}state.uploaded=n;document.getElementById('fileCount').textContent=`已選擇 ${n} 張圖片（尚未送出）`}
function messages(role){return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">IN-APP MESSAGES</div><h3>${role==='teacher'?'學生訊息':'訊息中心'}</h3><p>${role==='teacher'?'僅顯示自己授課學生的對話':'聯絡已錄取課程的講師；行政可依權限查閱'}</p></div></div><div class="split"><div class="card"><div class="member"><div class="mini-avatar">${role==='teacher'?'陳':'周'}</div><div><b>${role==='teacher'?'示範學生 A':'示範講師 B老師'}</b><div class="hint">頭皮養護基礎實作</div></div><span class="status approved" style="margin-left:auto">已錄取課程</span></div><div style="background:#f1eee6;border-radius:14px;padding:14px;margin:20px 0;line-height:1.6;font-size:13px">老師您好，想請問作業照片需要包含哪些角度？</div><div style="background:#e5f0eb;border-radius:14px;padding:14px;margin:20px 0 20px 18%;line-height:1.6;font-size:13px">請包含操作前、分區過程與完成後正面／側面，謝謝。</div><div style="display:flex;gap:8px"><input id="msg" class="search" style="flex:1" placeholder="輸入訊息…"><button class="btn primary" onclick="sendMsg()">傳送</button></div></div><div class="card"><h3>對話資訊</h3><p class="hint">關聯課程<br><b style="color:var(--ink)">頭皮養護基礎實作</b></p><p class="hint">訊息紀錄包含發送者、時間、已讀狀態與圖片附件。本版本僅使用站內通知，不寄送 Email。</p></div></div>`}
function sendMsg(){let el=document.getElementById('msg');if(!el||!el.value.trim())return toast('請先輸入訊息');el.value='';toast('訊息已傳送')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>el.classList.remove('show'),3000)}
function render(){if(!navs[state.role].some(n=>n[0]===state.page))state.page='home';let u=users[state.role];document.getElementById('userName').textContent=u.name;document.getElementById('userRole').textContent=u.role;document.getElementById('avatar').textContent=u.avatar;document.getElementById('pageTitle').textContent=titles[state.page]||'首頁';renderNav();let body=state.role==='admin'?(state.page==='home'?adminHome():state.page==='leave'?leaveReview():adminGeneric()):state.role==='manager'?managerPage():state.role==='teacher'?teacherPage():state.role==='internal'?internalPage():studentPage();document.getElementById('content').innerHTML=shell(body);window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('roleSelect').addEventListener('change',e=>{state.role=e.target.value;state.page='home';toast(`已切換為${users[state.role].role}`);render()});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();
</script>
</body>
</html>
